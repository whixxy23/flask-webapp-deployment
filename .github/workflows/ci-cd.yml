name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spins up a real Postgres instance for the duration of this job,
    # mirroring the production database this app actually talks to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # These are plain values for the throwaway test DB above — NOT secrets,
    # and NOT bash syntax. They must match the postgres: service block exactly.
    env:
      DB_HOST: localhost
      DB_NAME: webapp
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Load schema into test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f schema.sql

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t module5-web:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DB_HOST, DB_NAME, and DB_PORT are already hardcoded directly in
      # docker-compose.yml (DB_HOST: db, DB_NAME: webapp, DB_PORT: 5432) —
      # they're structural, not secret, so they don't belong here.
      # Only DB_USER and DB_PASSWORD are real secrets that need to exist
      # under Settings → Secrets and variables → Actions.
      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -f http://localhost:5000/health || exit 1

      - name: Show recent container logs
        if: always()
        run: docker compose logs --tail=50 web
