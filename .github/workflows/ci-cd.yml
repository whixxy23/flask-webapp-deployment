name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_NAME: webapp
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      # Fine to hardcode here — this only signs test-session cookies
      # inside a throwaway CI job, never used in production.
      SECRET_KEY: test-secret-key-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Load schema into test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f schema.sql

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t capstone-web:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DB_HOST now points at the real RDS endpoint, not the local 'db'
      # container — this is what makes production actually use the
      # managed database.
      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -f http://localhost:5000/health || exit 1

      - name: Show recent container logs
        if: always()
        run: docker compose logs --tail=50 web
