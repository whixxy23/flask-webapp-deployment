services:
  web:
    build: .
    container_name: module4_web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: webapp
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - appnet
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: module4_db
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - appnet
    restart: unless-stopped

# Named volume — lives outside any container's filesystem, so `docker compose down`
# (without -v) does NOT delete it. This is what makes the data persistent.
volumes:
  pgdata:

# Custom bridge network — lets 'web' reach 'db' by hostname ("db"),
# isolated from other containers/networks on the host.
networks:
  appnet:
    driver: bridge