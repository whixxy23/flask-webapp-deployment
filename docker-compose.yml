services:
  web:
    build: .
    container_name: capstone_web
    ports:
      - "5000:5000"
    environment:
      # DB_HOST defaults to the local 'db' container for dev/testing.
      # In production, the CI/CD pipeline passes a DB_HOST secret pointing
      # at the real RDS endpoint, which overrides this default entirely.
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - appnet
    restart: unless-stopped

  # Used for local development/testing only. In production, 'web' is pointed
  # at RDS via the DB_HOST secret, so this container runs but sits unused.
#   db:
#     image: postgres:16
#     container_name: capstone_db
#     environment:
#       POSTGRES_DB: webapp
#       POSTGRES_USER: ${DB_USER}
#       POSTGRES_PASSWORD: ${DB_PASSWORD}
#     volumes:
#       - pgdata:/var/lib/postgresql/data
#       - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
#     networks:
#       - appnet
#     restart: unless-stopped

# volumes:
#   pgdata:

networks:
  appnet:
    driver: bridge
